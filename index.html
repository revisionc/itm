<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive Technical Manual</title>
  <meta name="description" content="Interactive Technical Manual: a reconstruction and preservation project. Coming soon.">
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #12151d;
      --ink: #e6e3da;
      --muted: #8f8d86;
      --a: #e8a33d;
      --b: #9c8ed6;
      --c: #c96a5a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--panel);
      border-radius: 28px 6px 6px 28px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 20px 1fr;
    }
    .bar { background: linear-gradient(var(--a) 0 45%, var(--b) 45% 75%, var(--c) 75%); }
    .content { padding: 32px 28px 26px; }
    .tag {
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--a);
      margin-bottom: 18px;
    }
    h1 {
      font-size: clamp(28px, 7vw, 40px);
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin: 0 0 14px;
    }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 24px; }
    .status {
      display: inline-block;
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--bg);
      background: var(--b);
      padding: 6px 12px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <main>
    <div class="bar" aria-hidden="true"></div>
    <div class="content">
      <div class="tag">Reconstruction project</div>
      <h1>Interactive Technical Manual</h1>
      <p>A reconstruction and preservation project, rebuilding an interactive technical reference for modern browsers. Work is in progress.</p>
      <span class="status">Coming soon</span>
    </div>
  </main>
</body>
</html>
